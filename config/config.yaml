# LIDRA v3 Production Configuration
mode: local  # 'inline' (gateway bridge) | 'local' (same-machine) | 'monitor' (legacy)
log_dir: ./logs
state_dir: ./state

# General settings
general:
  verbose: false  # retest: INFO level — DEBUG per-packet logs stalled verdicts

# Database configuration
database:
  path: ./data/lidra.db
  cleanup_days: 30

# Inline Bridge Mode
bridge:
  interfaces:
    wan: null  # auto-detect if null
    lan: null  # auto-detect if null
  bridge_name: br_lidra
  management_ip: 10.0.0.1/24
  stp_enabled: true
  nfqueue_num: 0
  nfqueue_maxlen: 1024

# =============================================================================
# INLINE GATEWAY (BRIDGE) DEPLOYMENT — company/enterprise box
# =============================================================================
# The LIDRA box sits inline between the firewall and the protected network.
#
#   [Internet] -> [Firewall] -> [LIDRA box (2 NICs or 1 NIC + bridge)] -> [LAN]
#
# - WAN NIC faces the firewall (internet side)
# - LAN NIC faces the protected server(s)
# - LIDRA bridges WAN and LAN transparently and inspects every packet
#   crossing FORWARD in both directions via NFQUEUE.
# - Set `mode: inline` at the top of this file and define the interfaces below.
#
# The module src/bridge/bridge_setup.py owns this section.  In a real
# deployment you would run LIDRA on a dedicated host with two physical NICs
# (or one NIC + a transparent linux-bridge with `br_lidra` member interfaces).
# =============================================================================
# bridge_gw:
#   mode: bridge                    # "bridge" = transparent inline gateway
#   interfaces:
#     wan: eth0                     # internet-facing NIC (e.g. from firewall)
#     lan: eth1                     # server-facing NIC (e.g. to internal LAN)
#     # auto-detect: leave null to use src.utils.interface.detect_interface()
#   bridge_name: br_lidra           # Linux bridge that joins WAN+LAN
#   stp_enabled: true               # Spanning Tree (safe default; turn off
#                                   # only if the upstream switch already runs
#                                   # STP and you want faster convergence)
#   management_ip: 10.0.0.1/24      # optional mgmt IP on the bridge itself
#   nfqueue_num: 0                  # NFQUEUE number for the FORWARD chain
#   nfqueue_chain: FORWARD          # FORWARD for bridge mode, INPUT for local
#   ip_forwarding: true             # set /proc/sys/net/ipv4/ip_forward=1
#   nat:
#     enabled: true                 # MASQUERADE LAN -> WAN when LIDRA is the gateway
#     outbound_iface: eth0          # the WAN NIC to masquerade on
#   forwarding_rules:
#     allow_established: true       # add FORWARD ACCEPT on ESTABLISHED,RELATED
#     queue_bypass: true            # use --queue-bypass so unrouted pkts pass
#   firewall_backend: nftables      # "nftables" (preferred) or "iptables"

# Local (same-machine) mode — laptop inbound shield
local:
  interface: null  # auto-detect if null
  nfqueue_num: 0
  nfqueue_maxlen: 1024
  # `inline: true` installs a kernel NFQUEUE rule on THIS machine's inbound
  # path. That is a real interception point: if the rule lands without a
  # working consumer the host loses connectivity (reproduced on Kali
  # 7.1.5 — see docs/SAFE_LINK.md). Off by default so a plain `lidra`
  # start can never lock you out of your own box. Without it, LIDRA
  # captures with AF_PACKET and blocks with iptables rules.
  inline: false      # opt in with `lidra --local-inline` (or set true here)
  monitor_only: true # true = accept everything, only log what WOULD drop.
                     # Enforce needs inline: true AND monitor_only: false —
                     # this is an explicit opt-in pair, never implicit.

# Inline Engine Configuration
inline:
  enabled: true
  flow_cache:
    capacity: 5000
    clean_threshold: 15  # packets before skipping DPI on clean flows
  bloom:
    capacity: 50000
    error_rate: 0.001
  dpi:
    enabled: true
    max_reassembly_buffers: 10000
    stream_timeout_seconds: 300
  rate_limiting:
    packets_per_sec: 1000
    syns_per_sec: 100
    bytes_per_sec: 10485760
    window_seconds: 60

# Service port → protocol mapping (was hardcoded in connection_tracker.py)
service_port_map:
  80: http
  443: tls
  22: ssh
  53: dns
  21: ftp
  25: smtp
  110: pop3
  143: imap
  3306: mysql
  5432: postgresql
  6379: redis
  27017: mongodb
  8080: http
  8081: http
  8082: http
  8443: tls
  8888: http
  8000: http
  3000: http
  5000: http

# HTTP ports for stream reassembly (was hardcoded in stream_reassembler.py)
http_ports:
  - 80
  - 443
  - 8080
  - 8081
  - 8082
  - 8888
  - 8000
  - 8443
  - 3000
  - 9090
  - 5000

# Suspicious ports (was hardcoded in packet_sniffer.py)
suspicious_ports:
  - 4444
  - 5555
  - 31337
  - 1337

# Detection thresholds (was hardcoded in multiple files)
thresholds:
  syn_flood: 100
  port_scan: 20
  icmp_flood: 50
  dns_query: 100
  brute_force: 5
  threat_score_drop: 70
  threat_score_log: 40
  seq_covert_chars: 8
  seq_covert_samples: 10
  ack_covert_chars: 15
  ack_covert_samples: 10
  ttl_covert_window: 15
  ttl_covert_variations: 6

# nftables naming (was hardcoded in firewall.py and inline_engine.py)
nftables:
  queue_table: lidra_nfqueue
  bridge_table: lidra_bridge
  bridge_forward_chain: lidra_forward
  bridge_input_chain: lidra_input
  block_chain: LIDRA_BLOCK

# Scanner user-agent detection list (was hardcoded in dpi_engine.py)
scanner_agents:
  - nikto
  - nmap
  - sqlmap
  - dirbuster
  - gobuster
  - wpscan
  - nuclei
  - masscan
  - zgrab
  - burp
  - acunetix

# Suspicious SNI patterns (was hardcoded in dpi_engine.py)
suspicious_sni_patterns:
  - ".xyz"
  - ".tk"
  - ".ml"
  - ".ga"
  - ".cf"
  - "malware"
  - "phish"
  - "c2"
  - "botnet"
  - "reverse"
  - "shell"
  - "ransom"
  - "crypt"
  - "exploit"

# Suspicious commands (was hardcoded in ebpf/tracer.py)
suspicious_commands:
  - wget
  - curl
  - nc
  - ncat
  - bash -i
  - sh -i
  - python.*socket
  - mkfifo

# Suspicious file extensions (was hardcoded in ebpf/tracer.py)
suspicious_extensions:
  - .php
  - .exe
  - .sh
  - .pl
  - .py
  - .rb
  - .jar

# Suspicious paths (was hardcoded in ebpf/tracer.py)
suspicious_paths:
  - /tmp/
  - /var/tmp/
  - /dev/shm/
  - /proc/self/
  - /.ssh/
  - /.aws/

# Sensitive paths watched by ebpf/tracer.py file-access analysis
sensitive_paths:
  - /etc/passwd
  - /etc/shadow
  - /.ssh/
  - /.aws/
  - /var/log/
  - /proc/self/

# Detection - ALL server attack types
detection:
  thresholds:
    ssh_failed_attempts: 5
    time_window_seconds: 300
  log_sources:
    - /var/log/syslog
    - /var/log/auth.log
  enabled_attacks:
    - ssh_bruteforce
    - ssh_invalid_user
    - sql_injection
    - xss_attempt
    - path_traversal
    - lfi_attempt
    - command_injection
    - scanner_detected
    - mysql_bruteforce
    - smtp_bruteforce
    - ftp_bruteforce
    - sudo_failure

# Deception (Honeypot)
deception:
  honeypot_port: 2222
  honeyfiles:
    - ./state/honey/secret.txt
  cowrie:
    enabled: false
    config_path: ./config/cowrie.cfg

# Response configuration
response:
  block_command: block_ip.sh
  block_ttl_seconds: 3600
  dry_run: true  # Safety for live test
  firewall: nftables  # nftables for bridge mode, iptables for legacy

# Alerting configuration
alerts:
  slack_webhook: ""
  discord_webhook: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    from_addr: ""
    to_addrs: []

# Secrets are resolved via env vars with fallback to config values:
#   LIDRA_SMTP_PASSWORD  → alerts.email.password
#   LIDRA_ABUSEIPDB_KEY  → threat_intel.abuseipdb_api_key
#   LIDRA_VT_KEY         → threat_intel.virustotal_api_key

# Threat Intelligence
threat_intel:
  abuseipdb_api_key: ""  # Override via LIDRA_ABUSEIPDB_KEY env var
  virustotal_api_key: ""  # Override via LIDRA_VT_KEY env var
  check_on_detect: true
  auto_report: true
  cache_ttl_seconds: 3600   # Re-query upstream scores after 1h
  max_cache: 10000          # LRU cap on cached IPs

# Main periodic loop (honeypot poll, ML baseline, DB cleanup, …)
main_loop:
  cycle_seconds: 60         # 60s in dev, 300s in prod (legacy). Lower = more responsive
                             # but more CPU on log re-reads. 60s is a good production default.

# IP Whitelist (never block these)
whitelist:
  - 127.0.0.1
  - 192.168.1.9

# IPs to detect but NEVER block (test partners, trusted peers)
no_block:
  - 192.168.1.8
  - 192.168.1.10

# Network Collectors
collectors:
  network:
    enabled: true
    interface: null  # auto-detect if null
  syslog:
    enabled: true
    port: 514
    bind: "0.0.0.0"  # Listen address; set to "127.0.0.1" for local-only
    rate_limit: 100  # max messages/sec per source IP

# Terminal UI Configuration
tui:
  enabled: true
  refresh_rate: 4
  standalone: false  # Set to True to run TUI standalone with mock data

# TLS fingerprinting — known malicious JA4 hashes
# Seed: r3m0s/malicious-ja4-database (community, FoxIO JA4 spec).
# Refresh: https://github.com/r3m0s/malicious-ja4-database , https://ja4db.foxio.io/
tls_fingerprints:
  malicious_ja4:
    - t10i060500_4dc025c38c38_950472255fe9  # Covenant Grunt
    - t12d190800_d83cc789557e_7af1ed941c26  # Cobalt Strike
    - t13i131000_f57a46bbacb6_e5728521abd4  # Sliver
    - t12i180600_4b22cbed5bed_2dae41c691ec  # Mythic / PoshC2
    - t13i201100_2b729b4bf6f3_e24568c0d440  # Havoc Demon
    - t12d180700_4b22cbed5bed_2dae41c691ec  # AADInternals / TokenTactics
    - t13d1311h2_f57a46bbacb6_e7c285222651  # AzureHound
    - t13d201100_2b729b4bf6f3_36bf25f296df  # GraphRunner
    - t13d9013h1_c6771aded2ed_57a60bdf03d1  # GraphSpy / ROADtools

# False-Positive Allowlist (reduces noise from known-good sources)
allowlist:
  enabled: true
  include_cloudflare: true   # Skip noisy detections from Cloudflare IPs
  include_google: false      # Include Google IPs (DNS, services) only if needed
  include_aws: false         # Include AWS ranges only if you don't host there
  suppress_private: true     # Skip RFC1918 + loopback + multicast
  suppress_cloudflare: true  # Apply Cloudflare suppression
  suppress_google: false
  suppress_aws: false
  trusted_cidrs: []          # Custom trusted ranges. Examples:
                              #   ["203.0.113.0/24"]   - whole subnet
                              #   ["198.51.100.42"]    - single host (auto-converted to /32)
                              #   ["10.0.0.0/8"]       - private range
                              #   ["0.0.0.0/0"]        - trust everything (not recommended)
  trusted_cidrs_v6: []       # IPv6 trusted ranges, e.g. ["2001:db8::/32"]

# BRIDGE / INLINE GATEWAY MODE (organization deployment)
# Topology:  Internet → Firewall → [LIDRA box: WAN↔LAN bridge] → Internal network
# Uncomment the block below and set interface names for your hardware.
# bridge:
#   interfaces:
#     wan: eth0        # Internet-facing NIC (from firewall)
#     lan: eth1        # Internal-facing NIC (to your network/server)
#   bridge_name: br_lidra
#   management_ip: 10.0.0.1/24   # IP for the bridge itself
#   stp_enabled: false            # Spanning tree (usually off for 2-NIC bridges)
#   nfqueue_num: 0
#   nfqueue_maxlen: 1024
#   enable_nat: false             # Set true if LIDRA box is the gateway
#   masquerade_interface: wan     # Which iface to MASQUERADE (if enable_nat)
#   auto_create: false            # Set true to create bridge on start (needs root)
