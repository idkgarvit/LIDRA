# Prometheus config for the hybrid layout: LIDRA agent runs bare-metal on the
# host (systemd), Prometheus/Grafana run in Docker as a monitoring sidecar.
# Used via: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up prometheus grafana
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  - job_name: 'lidra-agent'
    # host.docker.internal = the machine running the containers = where the
    # host agent serves :8080/metrics. (Needs the extra_hosts entry in the
    # monitoring override file to resolve on Linux.)
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
