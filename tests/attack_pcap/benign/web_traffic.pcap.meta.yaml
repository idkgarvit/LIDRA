name: Benign web traffic
source: generated locally with scapy
description: 200 normal HTTP GET/response cycles from 50 clients
attack_category: benign
mitre: null
severity: info
expected_attack_types: []
expected_max_false_positives: 150
fp_rate_baseline: 0.08
notes: |
  Small but representative. 1200 packets of normal HTTP traffic.
  Used as the "this is what normal looks like" baseline.

  FP history:
    - 93 flagged (7.75%) originally
    - dominated by low_entropy_isn (71x) — the synthetic ISNs happen to
      land within the detector's "consecutive ISNs are spoofed" band; real
      networks show more entropy — plus session_correlated_sql_attack (18x)
      on what look like base64 CDN responses.
    - The packet count did not change materially after the alert gate
      (only ~1 packet was architecturally suppressed); was never the
      dominant noise source here.

  Threshold of 150 catches regression. Tracked as remaining tuning debt
  in COVERAGE.md.
