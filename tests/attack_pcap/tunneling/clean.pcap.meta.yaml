description: Benign DNS queries for FP-rate baseline
attack_category: benign
mitre: null
severity: info
expected_attack_types: []     # Must be empty — no FP allowed
expected_min_confidence: 0.0
expected_max_false_positives: 500
fp_rate_baseline: 0.073
notes: |
  1MB of normal DNS traffic. Used to confirm we don't flag normal
  DNS as tunneling.

  CURRENT FP RATE: 7.3% (364/4956 packets flagged).
  - ipv6_tunnel: 314x — false positive on encoded DNS names
  - command_injection: 40x — false on DNS base64 payloads
  - dns_tunnel: 8x — borderline; high-entropy queries trigger this
  - session_correlated_*: 4x

  Threshold of 500 catches regression (currently 364).
  Tracked in COVERAGE.md as remaining tuning debt.
