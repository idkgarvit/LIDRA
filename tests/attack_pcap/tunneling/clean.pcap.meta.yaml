name: Clean DNS traffic (no tunnel)
source: https://github.com/leshark/Simple-DNS-tunneling-detector
description: Benign DNS queries for FP-rate baseline
attack_category: benign
mitre: null
severity: info
expected_attack_types: []     # Must be empty — no FP allowed
expected_min_confidence: 0.0
expected_max_false_positives: 8
fp_rate_baseline: 0.0012
notes: |
  1MB of normal DNS traffic.

  FP rate history (see detection/alert_gate.py, detection/analyzer/ipv6_analyzer.py,
  and the DPI binary-protocol gate in detection/dpi_engine.py for the fixes):
    - 7.3% (364/4956) — original
    - 0.26% (13/4956) — after ipv6_tunnel was stopped from matching a DNS
      transaction-ID high nibble, DPI was forbidden on binary protocols
      (dns/tls/...), and the alert gate collapsed per-packet repeats.

  Remaining hits are a small number of dns_tunnel (high-entropy query
  borderline) and the baseline detectors — listed in COVERAGE.md as remaining
  tuning debt.

