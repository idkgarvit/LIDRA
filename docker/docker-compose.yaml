version: '3.8'

services:
  lidra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lidra-core
    hostname: lidra
    
    # eBPF requires privileged mode or specific capabilities
    privileged: true
    
    environment:
      - LIDRA_MODE=production
      - LIDRA_DRY_RUN=false
      - PYTHONUNBUFFERED=1
    
    volumes:
      # Read system logs (required for detection)
      - /var/log:/var/log:ro
      
      # Config directory
      - ../config:/opt/lidra/config:ro
      
      # Data persistence
      - lidra-data:/opt/lidra/data
      - lidra-logs:/opt/lidra/logs
      - lidra-state:/opt/lidra/state
      
      # Mount for potential auditd
      - /etc:/etc:ro
      - /proc:/proc:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    
    network_mode: host
    
    restart: unless-stopped
    
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Elasticsearch for centralized logging
