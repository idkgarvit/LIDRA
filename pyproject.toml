[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lidra"
version = "3.0.0"
description = "Lightweight Intrusion Detection and Response with Adaptive Deception"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Garvit Kanojia"}]
keywords = ["ids", "ips", "security", "honeypot", "ebpf", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "dpkt>=1.9.0",
    "prometheus-client>=0.20.0",
    "textual>=0.41.0",
]

[project.urls]
Homepage = "https://github.com/idkgarvit/LIDRA"
Repository = "https://github.com/idkgarvit/LIDRA"
Documentation = "https://github.com/idkgarvit/LIDRA"

[project.scripts]
lidra = "lidra_agent_v3:main"
lidra-cli = "cli.main:main"
lidra-tui = "tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
